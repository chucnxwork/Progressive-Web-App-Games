<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.2" filter="url(#glow)"/>

  <!-- Gamepad Body -->
  <g filter="url(#glow)" transform="translate(256, 260) scale(1)">
    <!-- Controller Body -->
    <path d="M -130,-40 C -150,-40 -170,10 -160,80 C -152,130 -115,140 -85,115 L -45,75 C -25,60 25,60 45,75 L 85,115 C 115,140 152,130 160,80 C 170,10 150,-40 130,-40 C 90,-40 60,-20 0,-20 C -60,-20 -90,-40 -130,-40 Z"
          fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="8" />

    <!-- D-Pad (Left) -->
    <g fill="#818cf8">
      <rect x="-105" y="-12" width="40" height="14" rx="4" />
      <rect x="-92" y="-25" width="14" height="40" rx="4" />
      <circle cx="-85" cy="-5" r="4" fill="#0f172a" />
    </g>

    <!-- Action Buttons (Right) -->
    <g>
      <circle cx="85" cy="-18" r="8" fill="#f43f5e" />
      <circle cx="98" cy="-5" r="8" fill="#38bdf8" />
      <circle cx="72" cy="-5" r="8" fill="#fbbf24" />
      <circle cx="85" cy="8" r="8" fill="#34d399" />
    </g>

    <!-- Center decorative emblem: Retro Spark -->
    <polygon points="0,-75 12,-45 42,-45 18,-25 28,5 0,-12 -28,5 -18,-25 -42,-45 -12,-45" fill="url(#accentGrad)" />
  </g>
</svg>
